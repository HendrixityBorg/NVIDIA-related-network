name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src scripts tests runs/2026-08-25-run-003
      - run: python scripts/validate_snapshot.py --snapshot data/snapshot_2026-08-25.json
      - run: pytest
